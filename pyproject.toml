[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wfshield"
version = "1.0.0"
description = "Zero-dependency GitHub Actions workflow security auditor — unpinned actions, write-all tokens, pull_request_target fork checkouts, untrusted interpolation, secret leakage, self-hosted runner abuse, pipe-to-shell and cache poisoning. CI-gate exit codes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mehul Patel" }]
keywords = [
    "github-actions", "ci", "supply-chain", "security", "audit",
    "devops", "lint", "workflow", "static-analysis", "zero-dependency",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = []

[project.scripts]
wfshield = "wfshield.cli:main"

[project.urls]
Homepage = "https://github.com/mehulpatel23b-pixel/wfshield"
Issues = "https://github.com/mehulpatel23b-pixel/wfshield/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wfshield = ["py.typed"]
